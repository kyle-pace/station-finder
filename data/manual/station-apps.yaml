# Station apps — hand-maintained app links for ANY station (PBS, NPR, or independent).
#
# This file is public. It lists apps a station offers, nothing else. It does not say
# who built an app or any business relationship, and nothing here
# changes how a station is ranked or displayed.
#
# Entries here win over scraped data. To add a station, copy the example block below,
# remove the leading "# ", and fill in only the platforms the station is actually on.
#
# id:          the station's id on the site (a short lowercase name, e.g. "kxyz").
#              Until station data exists (Phase 2), pick the obvious short name;
#              the build report will flag any id it can't match.
# platform:    ios, android, appletv, firetv, androidtv, roku, samsung, lg, web
# url:         the store page (or the station's own "get our app" page)
# source:      where you found the link (e.g. "station website", "store listing")
# retrievedAt: the date you checked it (YYYY-MM-DD)
#
# extra:       optional, true for an additional app (not the station's main app for
#              that platform), shown under "More apps from …"
# name:        optional app name, e.g. "KET Legislative Coverage" (used for extra apps)
# exclude:     optional list of links found on the station's site that are NOT its app
#              (the build will stop using them), e.g. a remote-control or partner app.
#
# Example:
# - id: example
#   apps:
#     - platform: ios
#       url: https://apps.apple.com/us/app/...
#       source: station website
#       retrievedAt: 2026-10-18
#   exclude:
#     - https://apps.apple.com/us/app/some-other-app/id123

- id: pbs-charlotte
  apps:
    - platform: roku
      url: https://my.roku.com/account/add/HPDZRHL
      source: hand-checked (published Roku channel link)
      retrievedAt: 2026-10-18
