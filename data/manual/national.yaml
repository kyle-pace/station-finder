# National apps, used on a station's page for any platform the station has no app of its own on.
# Hand-maintained. Every link records where it came from (source) and when (retrievedAt).
#
# Link kinds:
#   store — opens the app's page in that platform's store
#   help  — the network's own install instructions (used when no direct store link is published)
#
# Network names are text only. Do not add PBS/NPR logos (no endorsement implied).
# Do not add PBS KIDS apps or links (project rule; the build rejects them).

- id: pbs
  name: PBS
  description: Watch PBS shows, documentaries, and your local station's livestream.
  apps:
    - platform: ios
      kind: store
      url: https://apps.apple.com/us/app/pbs-watch-tv-documentaries/id398349296
      source: https://www.pbs.org/pbs-app/ (iOS link to.pbs.org/3MG3yF3 → App Store id398349296)
      retrievedAt: 2026-10-18
    - platform: android
      kind: store
      url: https://play.google.com/store/apps/details?id=com.pbs.video
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    # pbs.org links only help pages for most TV platforms; these direct store links are
    # the ones PBS member stations' own "PBS app" pages use.
    - platform: appletv
      kind: store
      url: https://apps.apple.com/us/app/pbs-watch-tv-documentaries/id398349296
      source: https://www.cetconnect.org/pbs-app/ (link "Download on Apple TV"; same App Store listing as iPhone)
      retrievedAt: 2026-10-18
    - platform: firetv
      kind: store
      url: https://www.amazon.com/dp/B008Z2NVGK
      source: https://www.cetconnect.org/pbs-app/ (link "Available on Fire TV"; also kvie.org "Get PBS on Fire TV")
      retrievedAt: 2026-10-18
    - platform: androidtv
      kind: store
      url: https://play.google.com/store/apps/details?id=com.pbs.video
      source: https://www.cetconnect.org/pbs-app/ (link "Available on Android TV"; same Google Play listing as phones)
      retrievedAt: 2026-10-18
    - platform: roku
      kind: store
      url: https://channelstore.roku.com/details/2926d0a0c976db9bfcc86d2364ff9dbc/pbs
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    # Samsung has no public web store page to link to, so this stays PBS's install help.
    - platform: samsung
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000059656-is-the-pbs-app-available-on-my-samsung-smart-tv-
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: lg
      kind: store
      url: https://us.lgappstv.com/main/tvapp/detail?appId=1260085
      source: https://www.ipm.org/tv/ (link "Download app on LG" in its PBS app section; also weta.org)
      retrievedAt: 2026-10-18
    - platform: web
      kind: store
      url: https://www.pbs.org/
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
  # Other store listings of the PBS app that station websites link to. Never shown; they
  # stop the scraper from counting the PBS app as a station's own app.
  otherStoreLinks:
    - url: https://channelstore.roku.com/details/23353/pbs
      source: https://www.kvie.org/app/tv-connected-devices/roku/ (link "Get PBS on Roku")
    - url: https://channelstore.roku.com/details/6bfb4fc9bfcfe6a4215e32e203439914:25f0df6d853649615c2ec64ef2555811/pbs
      source: https://minnesotapbs.org/pages/how-to-watch (Roku link on the PBS app section)

- id: npr
  name: NPR
  description: Listen to NPR news, podcasts, and your local station's live stream.
  apps:
    - platform: ios
      kind: store
      url: https://apps.apple.com/us/app/npr-national-local-news/id324906251
      source: https://www.npr.org/app ("Get the app" link npr.app/1NKi/getapp → App Store id324906251)
      retrievedAt: 2026-10-18
    - platform: android
      kind: store
      url: https://play.google.com/store/apps/details?id=org.npr.android.news
      source: https://www.npr.org/app ("Get the app" link, npr.app/1NKi/getapp)
      retrievedAt: 2026-10-18
    - platform: web
      kind: store
      url: https://www.npr.org/
      source: https://www.npr.org/app
      retrievedAt: 2026-10-18
