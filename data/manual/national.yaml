# National apps, used on a station's page for any platform the station has no app of its own on.
# Hand-maintained. Every link records where it came from (source) and when (retrievedAt).
#
# Link kinds:
#   store — opens the app's page in that platform's store
#   help  — the network's own install instructions (used when no direct store link is published)
#
# Network names are text only. Do not add PBS/NPR logos (no endorsement implied).
# Do not add PBS KIDS apps or links (project rule; the build rejects them).

- id: pbs
  name: PBS
  description: Watch PBS shows, documentaries, and your local station's livestream.
  apps:
    - platform: ios
      kind: store
      url: https://apps.apple.com/us/app/pbs-watch-tv-documentaries/id398349296
      source: https://www.pbs.org/pbs-app/ (iOS link to.pbs.org/3MG3yF3 → App Store id398349296)
      retrievedAt: 2026-10-18
    - platform: android
      kind: store
      url: https://play.google.com/store/apps/details?id=com.pbs.video
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: appletv
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000084210-how-do-i-download-the-pbs-app-on-apple-tv-
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: firetv
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000095640-how-to-use-the-pbs-app-on-android-tv-
      source: https://www.pbs.org/pbs-app/ (PBS uses one help link for Fire TV and Android TV)
      retrievedAt: 2026-10-18
    - platform: androidtv
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000095640-how-to-use-the-pbs-app-on-android-tv-
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: roku
      kind: store
      url: https://channelstore.roku.com/details/2926d0a0c976db9bfcc86d2364ff9dbc/pbs
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: samsung
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000059656-is-the-pbs-app-available-on-my-samsung-smart-tv-
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: lg
      kind: help
      url: https://help.pbs.org/support/solutions/articles/12000108270-how-to-install-the-pbs-app-on-lg-tv-
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18
    - platform: web
      kind: store
      url: https://www.pbs.org/
      source: https://www.pbs.org/pbs-app/
      retrievedAt: 2026-10-18

- id: npr
