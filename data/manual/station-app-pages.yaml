# Station app pages — hand-maintained, public. Known "get our app" pages on stations'
# own websites, plus each station's web streaming app if it has one.
#
# You don't need an entry for every station: fetch-station-app-pages already checks
# every station's homepage and follows links that look like an apps page. Add an entry
# when that automatic search misses a station's page, or to add a web app.
#
# Only public addresses (never staging, test, or internal links). No partner status.
#
# - id:       the station's id (see `npm run build-data -- --ids`)
#   appsPage: the station's own page listing its apps (store links are read from it)
#   webApp:   the station's web streaming app, shown as the "Web" link
#   note:     optional

