# Corrections — hand-maintained fixes to any station field. Always wins over every
# other source, and a pipeline re-run will never undo it.
#
# Each entry names a station id and the fields to replace. Add a note saying why.
#
# Example:
# - id: example
#   note: Station moved its livestream page (station website, 2026-10-18)
#   set:
#     livestreamUrl: https://example.org/live
#     website: https://example.org/

- id: kentucky-educational-television
  note: name the station uses on its own site (ket.org title "KET > Kentucky Educational Television")
  set:
    name: KET

- id: cape-cod-s-classic-alternative
  note: Wikipedia's branding field is a slogan; use the call sign (en.wikipedia.org/wiki/WSDH)
  set:
    name: WSDH

- id: kenai-and-soldotna
  note: Wikipedia's branding is "91.9FM Kenai and Soldotna" (a frequency and places); use the call sign (en.wikipedia.org/wiki/KDLL)
  set:
    name: KDLL

